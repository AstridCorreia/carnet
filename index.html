/* ---------------------------------------------------------------------
   7. LES GRAPHIQUES (SVG fait main, avec infobulle au toucher)
   --------------------------------------------------------------------- */
const charts = {}; let chartSeq = 0;
function chartBox(spec) { const id = "ch" + ++chartSeq; charts[id] = spec; return `<div class="chart" id="${id}" role="img" aria-label="${esc(spec.label || "Graphique")}"></div>`; }
function drawCharts() {
  for (const id of Object.keys(charts)) { const el = document.getElementById(id); if (!el) { delete charts[id]; continue; } try { charts[id].type === "bars" ? drawBars(el, charts[id]) : drawLine(el, charts[id]); } catch (e) { console.error(e); el.innerHTML = '<p class="empty">Graphique indisponible.</p>'; } }
}
let resizeT; window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(drawCharts, 150); });
function niceTicks(min, max, count = 4) {
  if (min === max) { const d = Math.abs(min) * 0.1 || 1; min -= d; max += d; }
  const step0 = (max - min) / count; const mag = 10 ** Math.floor(Math.log10(step0)); const e = step0 / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step; const ticks = [];
  for (let v = lo; v <= hi + step * 1e-9; v += step) ticks.push(+v.toFixed(10));
  return { lo, hi, ticks };
}
// Nombre de décimales selon l'écart entre graduations (évite "62, 62, 62…")
function yLabel(spec, v, step) { return spec.fmt === "pace" ? fmtPace(v) : fmtNum(v, step < 0.1 ? 2 : step < 1 ? 1 : 0); }
function drawLine(el, spec) {
  const pts = spec.pts || [];
  if (!pts.length) { el.innerHTML = `<p class="empty">Pas encore de données.</p>`; return; }
  const W = Math.max(260, el.clientWidth), H = 210, m = { l: 44, r: 16, t: 26, b: 28 };
  const tMin = Math.min(...pts.map((p) => p.t)), tMax = Math.max(...pts.map((p) => p.t));
  const t0 = tMin === tMax ? tMin - 3 * DAY : tMin, t1 = tMin === tMax ? tMax + 3 * DAY : tMax;
  const ys = pts.map((p) => p.y); const { lo, hi, ticks } = niceTicks(Math.min(...ys), Math.max(...ys));
  const X = (t) => m.l + ((t - t0) / (t1 - t0)) * (W - m.l - m.r);
  const Y = (v) => m.t + (1 - (v - lo) / (hi - lo || 1)) * (H - m.t - m.b);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p.t).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area = `${line}L${X(pts[pts.length - 1].t).toFixed(1)},${H - m.b}L${X(pts[0].t).toFixed(1)},${H - m.b}Z`;
  let g = "";
  for (const v of ticks) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="12" fill="var(--ink-3)">${esc(yLabel(spec, v, ticks[1] - ticks[0]))}</text>`;
  const nX = Math.min(4, Math.max(2, Math.floor((W - m.l - m.r) / 90)));
  for (let i = 0; i < nX; i++) { const t = t0 + ((t1 - t0) * i) / (nX - 1); g += `<text x="${X(t)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === nX - 1 ? "end" : "middle"}" font-size="12" fill="var(--ink-3)">${esc(new Date(t).toLocaleDateString("fr-FR", { day: "numeric", month: "short" }))}</text>`; }
  const dots = pts.length <= 60 ? pts.map((p) => `<circle cx="${X(p.t)}" cy="${Y(p.y)}" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join("") : "";
  const L = pts[pts.length - 1];
  const lastLbl = `<circle cx="${X(L.t)}" cy="${Y(L.y)}" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${Math.min(X(L.t), W - m.r)}" y="${Y(L.y) - 12}" text-anchor="end" font-size="13" font-weight="700" fill="var(--ink)">${esc(L.tip)}</text>`;
  el.innerHTML = `<svg width="${W}" height="${H}" tabindex="0" aria-hidden="true">
    <defs><linearGradient id="g${el.id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".18"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${g}<path d="${area}" fill="url(#g${el.id})"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lastLbl}
    <line class="xh" y1="${m.t}" y2="${H - m.b}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/><circle class="xd" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" style="display:none"/>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  attachHover(el, pts.map((p) => ({ x: X(p.t), y: Y(p.y), tip: p.tip, sub: p.sub })), true);
}
function drawBars(el, spec) {
  const items = spec.items || [];
  const W = Math.max(260, el.clientWidth), H = 170, m = { l: 30, r: 8, t: 16, b: 26 };
  const max = Math.max(1, ...items.map((i) => i.value)); const { hi, ticks } = niceTicks(0, max, Math.min(4, max));
  const bw = (W - m.l - m.r) / items.length; const Y = (v) => m.t + (1 - v / hi) * (H - m.t - m.b);
  let g = "";
  for (const v of ticks) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="12" fill="var(--ink-3)">${v}</text>`;
  const hits = [];
  items.forEach((it, i) => {
    const x = m.l + i * bw + 2, w = Math.max(4, bw - 4), y = Y(it.value), h = H - m.b - y, r = Math.min(4, w / 2, h);
    if (it.value > 0) g += `<path d="M${x},${H - m.b}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${H - m.b}Z" fill="var(--accent)" opacity="${i === items.length - 1 ? 1 : 0.75}"/>`;
    if (i % 3 === 2 || i === items.length - 1) g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${esc(it.label)}</text>`;
    hits.push({ x: x + w / 2, y: Math.min(y, H - m.b - 4), tip: it.tip, sub: it.sub });
  });
  el.innerHTML = `<svg width="${W}" height="${H}" tabindex="0" aria-hidden="true">${g}<line class="xh" style="display:none"/><circle class="xd" style="display:none"/><rect width="${W}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  attachHover(el, hits, false);
}
// Infobulle : on cherche le point le plus proche horizontalement du doigt / de la souris
function attachHover(el, hits, cross) {
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = svg.querySelector(".xh"), xd = svg.querySelector(".xd");
  let cur = -1;
  const show = (i) => {
    if (i < 0 || !hits[i]) return; cur = i; const p = hits[i];
    tip.innerHTML = "<b></b><span></span>"; tip.querySelector("b").textContent = p.tip; tip.querySelector("span").textContent = p.sub || "";
    tip.style.display = "block"; const w = tip.offsetWidth;
    tip.style.left = Math.max(w / 2, Math.min(el.clientWidth - w / 2, p.x)) + "px"; tip.style.top = Math.max(0, p.y - 10) + "px";
    if (cross) { xh.setAttribute("x1", p.x); xh.setAttribute("x2", p.x); xh.style.display = ""; xd.setAttribute("cx", p.x); xd.setAttribute("cy", p.y); xd.style.display = ""; }
  };
  const hide = () => { tip.style.display = "none"; xh.style.display = "none"; xd.style.display = "none"; cur = -1; };
  const nearest = (ev) => { const r = svg.getBoundingClientRect(); const x = ev.clientX - r.left; let bi = 0, bd = Infinity; hits.forEach((p, i) => { const d = Math.abs(p.x - x); if (d < bd) { bd = d; bi = i; } }); return bi; };
  svg.addEventListener("pointermove", (ev) => show(nearest(ev)));
  svg.addEventListener("pointerdown", (ev) => show(nearest(ev)));
  svg.addEventListener("pointerleave", (ev) => { if (ev.pointerType === "mouse") hide(); });
  svg.addEventListener("keydown", (ev) => { if (ev.key === "ArrowRight") show(Math.min(hits.length - 1, cur + 1)); else if (ev.key === "ArrowLeft") show(Math.max(0, cur < 0 ? hits.length - 1 : cur - 1)); });
  svg.addEventListener("blur", hide);
}

/* ---------------------------------------------------------------------
   8. LES ACTIONS
   Un seul "écouteur" pour toute la page : chaque bouton porte un
   data-act="…" qui dit quelle fonction appeler.
   --------------------------------------------------------------------- */
function go(view, push = true) {
  if (!VIEWS.includes(view)) view = "accueil";
  S.ui.view = view;
  if (view === "seance") LS.set("carnet.open", S.ui.sessionId);
  if (push && location.hash !== "#" + view) { try { history.pushState(null, "", "#" + view); } catch (e) { location.hash = view; } }
  window.scrollTo(0, 0);
  render();
}
window.addEventListener("popstate", () => fromHash());
window.addEventListener("hashchange", () => fromHash());
function fromHash() {
  const h = (location.hash || "").slice(1);
  const v = VIEWS.includes(h) ? h : "accueil";
  if (v === "seance" && !S.ui.sessionId) S.ui.sessionId = LS.get("carnet.open", null);
  if (v !== S.ui.view) { S.ui.view = v; window.scrollTo(0, 0); render(); }
}
function openSession(id) { S.ui.sessionId = id; go("seance"); }
const findEx = (s, exId) => s && s.exercises.find((e) => e.id === exId);

const actions = {
  nav: (el) => { if (el.dataset.view === "sauvegardes") backupsCache = null; go(el.dataset.view); },
  open: (el) => openSession(el.dataset.id),
  theme: () => {
    const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
    setMode(dark ? "light" : "dark");
  },
  setmode: (el) => setMode(el.dataset.mode),
  storageinfo: () => { const mi = modeInfo(); openModal({ title: mi.title, body: `<p>${esc(mi.text)}</p>`, actions: [{ label: "OK" }] }); },

  // --- Démarrer une séance ---
  start: (el) => {
    const typeId = el.dataset.type; const today = dateStr();
    const open = sortedSessions().find((s) => s.typeId === typeId && s.date === today && !s.endedAt);
    if (open) {
      openModal({ title: "Séance déjà commencée", body: `<p>Tu as déjà une séance « ${esc(sessionName(open))} » en cours aujourd'hui.</p>`, actions: [
        { label: "La reprendre", onClick: () => openSession(open.id) },
        { label: "En commencer une nouvelle", kind: "ghost", onClick: () => startNew(typeId, today) },
      ] });
    } else startNew(typeId, today);
  },
  pastsession: () => {
    const c = cfg();
    openModal({ title: "Séance d'un autre jour", body: `<label class="field">Type<select id="m-type">${c.types.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label>
      <label class="field">Date<input type="date" id="m-date" value="${dateStr(addDays(new Date(), -1))}" max="${dateStr()}"></label>`,
      actions: [{ label: "Créer", onClick: () => { const d = $("#m-date").value; if (!isDateStr(d)) { $("#m-date").classList.add("invalid"); return false; } startNew($("#m-type").value, d); } }, { label: "Annuler", kind: "ghost" }] });
  },
  finish: () => {
    const s = curSession(); if (!s) return;
    // Durée de séance remplie automatiquement si tu ne l'as pas notée (séance du jour, moins de 5 h)
    if (s.kind === "muscu" && !String(s.dur).trim() && s.date === dateStr()) {
      const mins = Math.round((Date.now() - (s.createdAt || Date.now())) / 60000); const fin = s.finisher ? parseDur(s.finisher.dur) : null;
      const v = mins - (ok(fin) ? Math.round(fin) : 0);
      if (v >= 5 && v <= 300) s.dur = v >= 60 ? `${Math.floor(v / 60)}h${pad2(v % 60)}` : String(v);
    }
    s.endedAt = Date.now(); saveSession(s, 0);
    const n = s.exercises.reduce((a, e) => a + filledSets(e).length, 0);
    const tot = sessionDurations(s).total;
    toast((s.kind === "muscu" ? `Bien joué ♥ ${n} série${n > 1 ? "s" : ""} enregistrée${n > 1 ? "s" : ""}` : "Bien joué ♥ Séance enregistrée") + (ok(tot) ? ` · ${fmtDur(tot)} au total` : ""));
    go("accueil");
  },
  delsession: async () => {
    const s = curSession(); if (!s) return;
    if (!(await confirmBox("Supprimer la séance ?", `« ${sessionName(s)} » du ${fmtDay(s.date)} ira dans la corbeille. Tu pourras la restaurer.`))) return;
    createBackup("Avant suppression d'une séance");
    const tid = toTrash("session", `${sessionName(s)} · ${fmtDay(s.date)}`, s);
    delete S.sessions[s.id]; sortedCache = null; persist("sessions", s.id, 0);
    go("accueil");
    undoToast("Séance supprimée", () => { restoreTrash(tid, true); openSession(s.id); });
  },

  // --- Exercices ---
  addex: () => {
    const s = curSession(); if (!s) return;
    const t = typeOf(s); const inSession = new Set(s.exercises.map((e) => norm(e.name)));
    const names = new Map();
    (t ? t.exercises : []).forEach((e) => e.name && names.set(norm(e.name), e.name));
    for (const x of sortedSessions()) for (const e of x.exercises) if (!names.has(norm(e.name))) names.set(norm(e.name), e.name);
    for (const ty of cfg().types) for (const e of ty.exercises) if (e.name && !names.has(norm(e.name))) names.set(norm(e.name), e.name);
    const sugg = [...names.entries()].filter(([k]) => !inSession.has(k)).slice(0, 40);
    openModal({ title: "Ajouter un exercice", body: `<label class="field">Nom de l'exercice<input id="m-exname" autocomplete="off" placeholder="ex. Pompes"></label>
      ${sugg.length ? `<span class="lbl">Suggestions</span><div class="sugg">${sugg.map(([, n]) => `<button type="button" class="chip" data-pick="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : ""}
      ${t ? `<label class="toggle"><input type="checkbox" id="m-addtpl"> L'ajouter aussi aux exercices habituels « ${esc(t.name)} »</label>` : ""}
      <div class="hint" id="m-hint" hidden>Donne un nom à l'exercice.</div>`,
      onOpen: (root) => {
        root.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => { $("#m-exname").value = b.dataset.pick; $("#m-exname").focus(); }));
        $("#m-exname").addEventListener("keydown", (e) => { if (e.key === "Enter") root.querySelector(".actions .btn").click(); });
      },
      actions: [{ label: "Ajouter", onClick: () => {
        const name = $("#m-exname").value.trim();
        if (!name) { $("#m-hint").hidden = false; $("#m-exname").classList.add("invalid"); return false; }
        const ex = buildExercise(name, null, s); s.exercises.push(ex); saveSession(s, 0);
        if (t && $("#m-addtpl") && $("#m-addtpl").checked && !t.exercises.some((e) => norm(e.name) === norm(name))) { t.exercises.push({ name, sets: String(ex.sets.length), reps: ex.sets[0] ? ex.sets[0].treps : "" }); saveConfig(0); }
        render(); setTimeout(() => { const c = document.getElementById("card-" + ex.id); c && c.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50);
      } }, { label: "Annuler", kind: "ghost" }] });
  },
  delex: async (el) => {
    const s = curSession(); const ex = findEx(s, el.dataset.ex); if (!ex) return;
    if (!(await confirmBox("Supprimer l'exercice ?", `« ${ex.name} » sera retiré de cette séance (récupérable dans la corbeille).`))) return;
    const index = s.exercises.indexOf(ex);
    const tid = toTrash("exercise", `${ex.name} (${sessionName(s)} · ${fmtShort(s.date)})`, ex, { sessionId: s.id, index });
    s.exercises.splice(index, 1); saveSession(s, 0); render();
    undoToast(`« ${ex.name} » supprimé`, () => restoreTrash(tid, true));
  },
  moveex: (el) => {
    const s = curSession(); const ex = findEx(s, el.dataset.ex); if (!ex) return;
    const i = s.exercises.indexOf(ex), j = i + +el.dataset.dir;
    if (j < 0 || j >= s.exercises.length) return;
    [s.exercises[i], s.exercises[j]] = [s.exercises[j], s.exercises[i]]; saveSession(s, 300); render();
    const c = document.getElementById("card-" + ex.id); c && c.scrollIntoView({ block: "center" });
  },
  addset: (el) => {
    const s = curSession(); const ex = findEx(s, el.dataset.ex); if (!ex) return;
    const prev = ex.sets[ex.sets.length - 1];
    // la nouvelle série reprend en gris les valeurs de la précédente
    ex.sets.push({ kg: "", reps: "", done: false, tkg: prev ? prev.kg || prev.tkg : "", treps: prev ? prev.reps || prev.treps : "" });
    saveSession(s, 300); render();
  },
  delset: (el) => {
    const s = curSession(); const ex = findEx(s, el.dataset.ex); if (!ex) return;
    const i = +el.dataset.i; const removed = ex.sets.splice(i, 1)[0]; saveSession(s, 300); render();
    undoToast(`Série ${i + 1} retirée`, () => { const e2 = findEx(S.sessions[s.id], ex.id); if (!e2) return; e2.sets.splice(Math.min(i, e2.sets.length), 0, removed); saveSession(S.sessions[s.id], 0); render(); });
  },
  setdone: (el) => {
    const s = curSession(); const ex = findEx(s, el.dataset.ex); if (!ex) return;
    const st = ex.sets[+el.dataset.i]; if (!st) return;
    // Valider une série vide = "j'ai fait l'objectif en gris"
    st.done = !st.done;
    if (st.done) { if (!String(st.kg).trim() && st.tkg) st.kg = st.tkg; if (!String(st.reps).trim() && st.treps) st.reps = st.treps; }
    saveSession(s, 400); render();
  },
  quick: (el) => {
    const s = curSession(); const ex = findEx(s, el.dataset.ex); if (!ex) return;
    const txt = el.dataset.text;
    if (!ex.note.includes(txt)) ex.note = ex.note.trim() ? ex.note.trim() + " · " + txt : txt;
    if (txt === "Technique à revoir") ex.tech = true;
    saveSession(s, 300); render();
  },
  rate: (el) => {
    const s = curSession(); if (!s) return;
    const tg = el.dataset.target; const v = +el.dataset.val;
    if (tg === "s") s.rating = s.rating === v ? 0 : v;
    else if (tg === "c") s.cardio.rating = s.cardio.rating === v ? 0 : v;
    else { const ex = findEx(s, tg.slice(3)); if (ex) ex.rating = ex.rating === v ? 0 : v; }
    saveSession(s, 300); render();
  },
  sub: (el) => { const s = curSession(); if (!s || !s.cardio) return; s.cardio.sub = el.dataset.val; saveSession(s, 300); render(); },
  wmode: (el) => {
    const s = curSession(); const ex = findEx(s, el.dataset.ex); if (!ex) return;
    const m = el.dataset.m === "side" ? "side" : "total"; if (ex.wmode === m) return;
    ex.wmode = m; saveSession(s, 300); render();
    toast(m === "side" ? "Note maintenant le poids de chaque côté (le total est calculé pour toi)" : "Note maintenant le poids total");
  },
  addfin: () => {
    const s = curSession(); if (!s) return;
    s.finisher = { type: (cfg().finisherTypes || [])[0] || "", dur: "", dist: "", note: "", tdur: "" }; saveSession(s, 0); render();
    setTimeout(() => { const f = document.getElementById("f-fdur"); f && f.scrollIntoView({ block: "center" }); }, 30);
  },
  delfin: () => {
    const s = curSession(); if (!s || !s.finisher) return;
    const old = clone(s.finisher); s.finisher = null; saveSession(s, 0); render();
    undoToast("Cardio de fin retiré", () => { const s2 = S.sessions[s.id]; if (!s2) return; s2.finisher = old; saveSession(s2, 0); render(); });
  },
  fintype: (el) => { const s = curSession(); if (!s || !s.finisher) return; s.finisher.type = el.dataset.val; saveSession(s, 300); render(); },
  calcdur: () => {
    const s = curSession(); if (!s) return;
    const mins = Math.round((Date.now() - (s.createdAt || Date.now())) / 60000);
    const fin = s.finisher ? parseDur(s.finisher.dur) : null;
    const v = Math.max(1, mins - (ok(fin) ? Math.round(fin) : 0));
    s.dur = v >= 60 ? `${Math.floor(v / 60)}h${pad2(v % 60)}` : String(v); saveSession(s, 0); render();
    toast(`Depuis le début : ${fmtDur(mins)}${ok(fin) ? " (cardio de fin déduit)" : ""}`);
  },

  // --- Historique ---
  histtype: (el) => { S.ui.histType = el.dataset.type; S.ui.histDate = null; render(); },
  calnav: (el) => {
    const b = S.ui.calMonth ? parseDate(S.ui.calMonth) : new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    S.ui.calMonth = dateStr(new Date(b.getFullYear(), b.getMonth() + +el.dataset.dir, 1)); render();
  },
  calday: (el) => {
    const d = el.dataset.date; const list = sortedSessions().filter((s) => s.date === d && (S.ui.histType === "all" || s.typeId === S.ui.histType));
    if (list.length === 1) return openSession(list[0].id);
    if (list.length > 1) { S.ui.histDate = d; render(); return; }
    if (d <= dateStr()) {
      openModal({ title: fmtDay(d), body: `<p>Aucune séance ce jour-là. En ajouter une ?</p><label class="field">Type<select id="m-type">${cfg().types.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label>`,
        actions: [{ label: "Ajouter", onClick: () => startNew($("#m-type").value, d) }, { label: "Fermer", kind: "ghost" }] });
    }
  },
  clearday: () => { S.ui.histDate = null; render(); },

  // --- Progrès ---
  progtab: (el) => { S.ui.progTab = el.dataset.tab; render(); },
  metric: (el) => { S.ui.progMetric = el.dataset.m; render(); },

  // --- Semaine ---
  weeknav: (el) => { S.ui.weekOffset = Math.min(0, S.ui.weekOffset + +el.dataset.dir); render(); },
  gotoweek: (el) => { const m = parseDate(el.dataset.monday); S.ui.weekOffset = Math.round((m - mondayOf(new Date())) / (7 * DAY)); window.scrollTo(0, 0); render(); },
  delweek: async (el) => {
    const w = S.weeks[el.dataset.id]; if (!w) return;

/* --- Saisie : chaque champ porte data-bind="…" qui dit où ranger la valeur --- */
function validateField(el) {
  const kind = el.dataset.v; if (!kind) return true;
  const v = el.value; let bad = false;
  if (kind === "num") { const n = parseNum(v); bad = Number.isNaN(n); }
  if (kind === "int") { const n = parseNum(v); bad = Number.isNaN(n) || (n != null && (!Number.isInteger(n) || n < 0)); }
  if (kind === "dur") { bad = Number.isNaN(parseDur(v)); }
  el.classList.toggle("invalid", bad); el.setAttribute("aria-invalid", bad ? "true" : "false");
  // Message sous le bloc concerné (on ne bloque jamais la saisie)
  const card = el.closest(".card");
  const hint = card && card.querySelector(".hint[data-hint]");
  if (hint) {
    const anyBad = card.querySelector(".invalid");
    hint.hidden = !anyBad;
    if (anyBad) hint.textContent = anyBad.dataset.v === "dur" ? "Durée non reconnue : écris par ex. 45, 32:30 ou 1h05. C'est gardé tel quel." : anyBad.dataset.v === "int" ? "Les répétitions / rounds doivent être un nombre entier. C'est gardé tel quel, mais ignoré dans les graphiques." : "Ce n'est pas un nombre (ex. 42,5). C'est gardé tel quel, mais ignoré dans les graphiques.";
  }
  return !bad;
}
// Met à jour les petits calculs affichés (allure, durée totale, charge totale) sans redessiner l'écran
function updateDerived(s) {
  const out = $("#paceOut"); if (out) { const st = cardioStats(s); out.textContent = ok(st.pace) ? `${fmtPace(st.pace)}/km · ${fmtNum(st.speed, 1)} km/h` : "–"; }
  const d = $("#durOut"); if (d) d.innerHTML = durText(s);
  for (const ex of s.exercises) { const t = document.getElementById("tot-" + ex.id); if (t) t.textContent = totLine(ex); }
}
function onBind(el, isChange) {
  const b = el.dataset.bind; if (!b) return;
  const val = el.type === "checkbox" ? el.checked : el.value;
  const parts = b.split(".");
  validateField(el);
  if (parts[0] === "s" || parts[0] === "ex" || parts[0] === "set" || parts[0] === "c" || parts[0] === "fin") {
    const s = curSession(); if (!s) return;
    if (parts[0] === "fin") { if (!s.finisher) return; s.finisher[parts[1]] = val; updateDerived(s); saveSession(s); return; }
    if (parts[0] === "s") {
      if (parts[1] === "date") { if (!isDateStr(val)) return; s.date = val; saveSession(s, 300); if (isChange) render(); return; }
      s[parts[1]] = val;
    } else if (parts[0] === "set") {
      const ex = findEx(s, parts[1]); const st = ex && ex.sets[+parts[2]]; if (!st) return; st[parts[3]] = val;
    } else if (parts[0] === "ex") {
      const ex = findEx(s, parts[1]); if (!ex) return;
      if (parts[2] === "inc") { ex.inc[parts[3]] = val; if (parts[3] === "on") { saveSession(s, 300); render(); return; } }
      else { ex[parts[2]] = val; if (parts[2] === "tech") { saveSession(s, 300); render(); return; } }
    } else if (parts[0] === "c") {
      if (!s.cardio) return;
      if (parts[1] === "inc") { s.cardio.inc[parts[2]] = val; if (parts[2] === "on") { saveSession(s, 300); render(); return; } }
      else s.cardio[parts[1]] = val;
    }
    updateDerived(s);
    saveSession(s);
    return;
  }
  if (parts[0] === "w") {
    const mon = addDays(mondayOf(new Date()), 7 * S.ui.weekOffset); const wk = isoWeek(mon);
    let w = S.weeks[wk.id];
    if (!w) w = S.weeks[wk.id] = { id: wk.id, monday: dateStr(mon), weight: "", food: "", note: "", createdAt: Date.now(), updatedAt: Date.now() };
    w[parts[1]] = val; w.updatedAt = Date.now(); persist("weeks", wk.id);
    if (parts[1] === "weight") { needRender = true; } // la courbe se mettra à jour en quittant le champ
    return;
  }
  if (parts[0] === "t" || parts[0] === "te" || parts[0] === "cfg") {
    const c = cfg();
    if (parts[0] === "cfg") {
      if (parts[1] === "finisherTypes") c.finisherTypes = String(val).split(",").map((x) => x.trim()).filter(Boolean);
      else c[parts[1]] = val;
      saveConfig(); return;
    }
    const t = c.types.find((x) => x.id === S.ui.editTypeId); if (!t) return;
    if (parts[0] === "t") {
      if (parts[1] === "subs") { const list = String(val).split(",").map((x) => x.trim()).filter(Boolean); c[t.kind === "course" ? "runTypes" : "boxeTypes"] = list; }
      else if (parts[1] === "name") t.name = val.trim() ? val : t.name;
      else if (parts[1] === "kind") { t.kind = val; saveConfig(300); render(); return; }
    } else { const e = t.exercises[+parts[1]]; if (!e) return; e[parts[2]] = val; }
    saveConfig();
  }
}

/* --- Export : fichier .json avec TOUT (séances, semaines, réglages, corbeille) --- */
async function doExport() {
  const c = cfg(); c.lastExportAt = Date.now();
  const json = JSON.stringify(snapshotData(), null, 1);
  const filename = `carnet-entrainement-${dateStr()}.json`;
  const done = () => { saveConfig(0); toast("Export prêt : range le fichier en lieu sûr (Drive, mails…)"); if (S.ui.view === "plus" || S.ui.view === "accueil") render(); };
  if (Store.dl) {
    try { await Store.dl.save({ filename, data: json }); done(); return; }
    catch (e) { if (e && e.code === "declined") { c.lastExportAt = null; return; } console.warn(e); }
  } else if (!window.claude) {
    // Sur téléphone : feuille de partage (Enregistrer dans Fichiers, Drive, mail…)
    try {
      const file = new File([json], filename, { type: "application/json" });
      if (matchMedia("(pointer: coarse)").matches && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Export carnet d'entraînement" }); done(); return;
      }
    } catch (e) { if (e && e.name === "AbortError") { c.lastExportAt = null; return; } console.warn(e); }
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); done(); return; } catch (e) { console.warn(e); }
  }
  // Plan B : copier le texte
  openModal({ title: "Exporter (copier)", body: `<p class="small">Le téléchargement n'est pas disponible ici. Copie ce texte et colle-le dans un fichier ou une note (nommé ${esc(filename)}).</p><textarea class="export" id="m-export" readonly>${esc(json)}</textarea>`,
    actions: [{ label: "Copier", onClick: () => { navigator.clipboard.writeText(json).then(() => { done(); }, () => { const t = $("#m-export"); t.select(); toast("Sélectionné : fais Copier"); }); return false; } }, { label: "Fermer", kind: "ghost" }] });
}
/* --- Import : on lit le fichier, on vérifie, puis on propose fusionner / remplacer --- */
async function handleImport(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { toast("Ce fichier n'est pas un export valide (JSON illisible).", { error: true }); return; }
  if (!data || typeof data !== "object" || !Array.isArray(data.sessions)) { toast("Ce fichier ne ressemble pas à un export du carnet.", { error: true }); return; }
  const nS = data.sessions.length, nW = Array.isArray(data.weeks) ? data.weeks.length : 0;
  openModal({ title: "Importer ce fichier ?", body: `<p>Il contient <b>${nS}</b> séances et <b>${nW}</b> semaines${data.exportedAt ? `, exportées le ${esc(new Date(data.exportedAt).toLocaleDateString("fr-FR"))}` : ""}.</p>
    <p class="small muted"><b>Fusionner</b> : ajoute ce qui manque et garde la version la plus récente de chaque séance. <b>Tout remplacer</b> : l'appli devient exactement le fichier. Dans les deux cas, une sauvegarde est faite avant.</p>`,
    actions: [
      { label: "Fusionner", onClick: () => { applyImport(data, false); } },
      { label: "Tout remplacer", kind: "danger", onClick: () => { applyImport(data, true); } },
      { label: "Annuler", kind: "ghost" },
    ] });
}
async function applyImport(data, replace) {
  toast("Import en cours…");
  await createBackup(replace ? "Avant import (remplacement)" : "Avant import (fusion)");
  try {
    if (replace) replaceAll(data);
    else {
      let n = 0;
      for (const kind of KINDS) for (const raw of data[kind] || []) {
        if (kind === "weeks") { const w = normWeek(raw); if (!w.id) continue; const cur = S.weeks[w.id]; if (!cur || w.updatedAt > (cur.updatedAt || 0)) { S.weeks[w.id] = w; persist("weeks", w.id, 50); n++; } continue; }
        const x = NORMALIZERS[kind](raw); if (raw && raw.id) x.id = safeId(raw.id);
        const cur = S[kind][x.id]; if (!cur || x.updatedAt > (cur.updatedAt || 0)) { S[kind][x.id] = x; persist(kind, x.id, 50); n++; }
      }
      if (data.config) { const ic = normConfig(data.config); const c = cfg(); for (const t of ic.types) if (!c.types.some((x) => x.id === t.id)) c.types.push(t); saveConfig(50); }
      sortedCache = null; toast(`Import terminé : ${n} élément${n > 1 ? "s" : ""} ajouté${n > 1 ? "s" : ""} ou mis à jour.`);
    }
    render();
  } catch (e) { console.error(e); toast("L'import a échoué. Tes données d'avant sont intactes (voir Sauvegardes).", { error: true }); }
}
// Remplace TOUT par les données fournies (import "remplacer" ou restauration)
function replaceAll(data) {
  const next = { sessions: {}, weeks: {}, trash: {} };
  for (const raw of data.sessions || []) { const x = normSession(raw); if (raw && raw.id) x.id = safeId(raw.id); next.sessions[x.id] = x; }
  for (const raw of data.weeks || []) { const w = normWeek(raw); if (w.id) next.weeks[w.id] = w; }
  for (const raw of data.trash || []) { const x = normTrash(raw); next.trash[x.id] = x; }
  const now = Date.now();
  for (const kind of KINDS) {
    for (const id of Object.keys(S[kind])) if (!next[kind][id]) { delete S[kind][id]; persist(kind, id, 50); }
    for (const [id, v] of Object.entries(next[kind])) { v.updatedAt = Math.max(v.updatedAt || 0, now); S[kind][id] = v; persist(kind, id, 50); }
  }
  S.config = normConfig(data.config); S.config.updatedAt = now; persist("config", null, 50);
  sortedCache = null;
}

/* ---------------------------------------------------------------------
   9. LE DÉMARRAGE
   --------------------------------------------------------------------- */
async function boot() {
  // icônes de la barre du bas
  $$("[data-ico]").forEach((s) => { s.outerHTML = s.dataset.ico === "heartf" ? icon("heart", true) : icon(s.dataset.ico); });
  const m = LS.get("carnet.theme", "auto"); if (m !== "auto") document.documentElement.setAttribute("data-mode", m);
  // 1) on affiche tout de suite la copie de l'appareil
  loadMirror();
  // 2) on rejoue les modifs pas encore envoyées
  const ob = LS.get("carnet.outbox", {});
  for (const [key, e] of Object.entries(ob)) {
    if (!e || !e.kind) continue;
    Store.outbox[key] = { kind: e.kind, id: e.id, ts: e.ts || Date.now() };
    if (e.kind === "config") { if (e.data) S.config = normConfig(e.data); }
    else if (KINDS.includes(e.kind)) { if (e.data == null) delete S[e.kind][e.id]; else { const n = NORMALIZERS[e.kind](e.data); n.id = e.id; S[e.kind][e.id] = n; } }
  }
  const h = (location.hash || "").slice(1);
  S.ui.view = VIEWS.includes(h) ? h : "accueil";
  if (S.ui.view === "seance") S.ui.sessionId = LS.get("carnet.open", null);
  if (S.ui.view === "types") S.ui.view = "plus";
  render();
  // 3) on cherche la base synchronisée de Claude
  // Dans Claude, la page tourne dans un cadre (iframe) : on attend un peu que Claude se présente.
  // Hébergée ailleurs (GitHub Pages…), pas d'attente.
  let waited = 0; const framed = window.self !== window.top;
  while (framed && !(window.claude && typeof window.claude.use === "function") && waited < 1500) { await sleep(100); waited += 100; }
  if (window.claude && typeof window.claude.use === "function") {
    try { await initCloud(); } catch (e) { console.error(e); goOffline("La synchronisation n'a pas pu démarrer. Tu travailles sur la copie de cet appareil."); }
  } else {
    registerSW();
    const conf = LS.get("carnet.firebase", null);
    if (conf) { initFirebase(conf); return; }
    Store.mode = "local"; Store.ready = true; Store.outbox = {}; LS.del("carnet.outbox");
    if (!S.config) { cfg(); saveMirrorSoon(); }
    render(); dailyBackup();
  }
}
// Service worker : garde l'appli en cache pour qu'elle s'ouvre même sans réseau (seulement si elle est hébergée)
function registerSW() {
  try {
    if ("serviceWorker" in navigator && window.self === window.top && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
  } catch (e) {}
}
boot();
</script>

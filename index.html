<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6dfe5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Carnet d'entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PARTIE 1 : LE STYLE (CSS)
   Idée de mise en page : carnet mobile à une colonne, barre d'onglets
   en bas (accessible au pouce), cartes empilées, chiffres en police
   condensée. Toutes les couleurs passent par des "tokens" (variables
   CSS) pour que le mode sombre change tout d'un coup.
   ===================================================================== */
:root {
  /* Palette : rose framboise, rose poudré, beige sable */
  --bg: #fbf3ee;          /* fond beige rosé */
  --surface: #fffaf7;     /* cartes */
  --surface-2: #f6e7e1;   /* champs */
  --ink: #3e2a30;         /* texte (prune très foncé) */
  --ink-2: #6f535a;
  --ink-3: #94777f;
  --line: #efd8d1;
  --accent: #c2477a;      /* rose framboise : boutons */
  --accent-ink: #ffffff;
  --accent-soft: #fbe2ea;
  --warn: #9a5520; --warn-bg: #fdebd6;
  --danger: #b8384a; --danger-bg: #fbe3e5;
  --good: #3f8460; --good-bg: #e3f1e7;
  --heart: #e0517f;       /* cœurs du ressenti */
  /* 8 couleurs douces pour les types de séance */
  --c1: #e0739a; --c2: #e38c4f; --c3: #4f9d76; --c4: #c9962a;
  --c5: #b064c9; --c6: #4f8fc8; --c7: #7b6bd6; --c8: #d65a5a;
  /* couleurs des dessins */
  --art-pink: #f2a7bf; --art-rose: #d9668f; --art-blush: #fbd9e3; --art-beige: #f3e3d7; --art-cream: #fffaf5; --art-gold: #e8b65c; --art-leaf: #9cc2a5;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 20px;
  --shadow: 0 1px 2px rgba(120,60,80,.05), 0 6px 18px rgba(194,71,122,.07);
  color-scheme: light;
}
/* Mode sombre automatique (réglage du téléphone), sauf si on a forcé "clair" */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-mode="light"]) {
    --bg: #1d1518; --surface: #281d21; --surface-2: #33262b; --ink: #f7eaee; --ink-2: #d9c2c9; --ink-3: #ab929a; --line: #45333a;
    --accent: #f191b3; --accent-ink: #2a1019; --accent-soft: #4a2533;
    --warn: #f4b77a; --warn-bg: #3b2814; --danger: #ff8f8f; --danger-bg: #3d1a1d; --good: #8fcfa6; --good-bg: #183224;
    --heart: #f27aa3;
    --c1: #ee86aa; --c2: #f0a774; --c3: #7fc39e; --c4: #e5bd55; --c5: #c792e0; --c6: #74b3e3; --c7: #a597ec; --c8: #ec7878;
    --art-pink: #e27da1; --art-rose: #b9557c; --art-blush: #5a3441; --art-beige: #3a2c2f; --art-cream: #f7e7dc; --art-gold: #e9c27a; --art-leaf: #7fae8e;
    --shadow: none; color-scheme: dark;
  }
}
/* Mode sombre demandé par l'appli Claude ou forcé par toi */
:root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"] {
  --bg: #1d1518; --surface: #281d21; --surface-2: #33262b; --ink: #f7eaee; --ink-2: #d9c2c9; --ink-3: #ab929a; --line: #45333a;
    --accent: #f191b3; --accent-ink: #2a1019; --accent-soft: #4a2533;
    --warn: #f4b77a; --warn-bg: #3b2814; --danger: #ff8f8f; --danger-bg: #3d1a1d; --good: #8fcfa6; --good-bg: #183224;
    --heart: #f27aa3;
    --c1: #ee86aa; --c2: #f0a774; --c3: #7fc39e; --c4: #e5bd55; --c5: #c792e0; --c6: #74b3e3; --c7: #a597ec; --c8: #ec7878;
    --art-pink: #e27da1; --art-rose: #b9557c; --art-blush: #5a3441; --art-beige: #3a2c2f; --art-cream: #f7e7dc; --art-gold: #e9c27a; --art-leaf: #7fae8e;
    --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}
h1, h2, h3 { font-family: var(--font-display); letter-spacing: .01em; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: 32px; font-weight: 700; }
h2 { font-size: 23px; font-weight: 600; }
h3 { font-size: 20px; font-weight: 600; }
h1 em, h2 em { color: var(--accent); }
p { margin: 0; }
.num, input, .tab-num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---- En-tête ---- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-weight: 700; font-style: italic; font-size: 24px; background: none; border: 0; padding: 4px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.brand svg { width: 22px; height: 22px; color: var(--heart); }
.brand { white-space: nowrap; }
.brand span { color: var(--accent); }
@media (max-width: 520px) { .brand > span { display: none; } }
.sync { margin-left: auto; white-space: nowrap; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.sync.ok::before { background: var(--good); }
.sync.busy::before { background: var(--accent); }
.sync.warn { background: var(--warn-bg); color: var(--warn); }
.sync.warn::before { background: var(--warn); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* ---- Structure ---- */
main { max-width: 720px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.banner { max-width: 720px; margin: 10px auto 0; padding: 0 16px; }
.banner > div { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 15px; display: flex; gap: 10px; align-items: flex-start; }
.banner button { margin-left: auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.muted { color: var(--ink-3); }
.small { font-size: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* ---- Boutons ---- */
.btn { min-height: 48px; padding: 10px 18px; border-radius: 999px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 17px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: var(--danger-bg); color: var(--danger); }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 6px 14px; font-size: 15px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn[disabled] { opacity: .5; cursor: default; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 0; cursor: pointer; text-align: left; }

/* ---- Champs ---- */
input[type="text"], input[type="date"], input[type="email"], input[type="password"], input:not([type]), select, textarea {
  width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-size: 17px; }
textarea { resize: none; overflow: hidden; field-sizing: content; min-height: 72px; line-height: 1.4; }
input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: .85; }
.invalid { border-color: var(--danger) !important; background: var(--danger-bg) !important; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px; color: var(--ink-2); }
label.field .opt { font-weight: 400; color: var(--ink-3); }
.hint { font-size: 14px; color: var(--danger); }
.toggle { display: flex; align-items: center; gap: 12px; min-height: 44px; font-weight: 600; cursor: pointer; }
.toggle input { width: 24px; height: 24px; accent-color: var(--accent); flex: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---- Puces / pastilles ---- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 38px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.good { background: var(--good-bg); color: var(--good); }
.badge svg { width: 14px; height: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--ink-3)); flex: none; display: inline-block; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* ---- Accueil ---- */
.hello { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.type-btn { position: relative; text-align: left; min-height: 92px; padding: 14px 14px 12px 18px; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; box-shadow: var(--shadow); overflow: hidden; }
.type-btn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.type-btn b { font-family: var(--font-display); font-size: 21px; font-weight: 600; line-height: 1.1; position: relative; z-index: 1; }
.type-btn span { position: relative; z-index: 1; }
.type-btn .art { position: absolute; right: 8px; bottom: 6px; width: 46px; height: 46px; opacity: .95; z-index: 0; }
.type-btn::after { content: ""; position: absolute; right: -18px; top: -18px; width: 70px; height: 70px; border-radius: 50%; background: var(--c); opacity: .13; }
.type-btn span { font-size: 14px; color: var(--ink-3); }
.resume { border-color: var(--art-pink); background: var(--accent-soft); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.tile b { display: block; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.05; color: var(--accent); }
.tile span { font-size: 13px; color: var(--ink-3); }
.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }

/* ---- Séance (éditeur) ---- */
.ed-head { display: flex; flex-direction: column; gap: 10px; }
.ed-title { display: flex; align-items: center; gap: 10px; }
.ed-title h1 { font-size: 32px; }
.ex.flag { border-color: var(--warn); }
.ex-head { display: flex; align-items: center; gap: 8px; }
.ex-name { font-family: var(--font-display); font-weight: 600; font-size: 21px !important; background: transparent !important; border-color: transparent !important; padding: 4px 6px !important; min-height: 40px !important; margin-left: -6px; }
.ex-name:focus { border-color: var(--line) !important; background: var(--surface-2) !important; }
.ex-count { font-size: 14px; font-weight: 700; color: var(--ink-3); white-space: nowrap; }
.ex-tools { display: flex; gap: 6px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
.ex-tools button:disabled { opacity: .35; }
.ex-tools .del { width: auto !important; padding: 0 12px; gap: 6px; display: inline-flex !important; align-items: center; font-weight: 600; font-size: 15px; background: var(--danger-bg) !important; }
.ex-tools button { width: 42px; height: 40px; border-radius: 10px; border: 0; background: var(--surface-2); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.ex-tools button svg { width: 18px; height: 18px; }
.ex-tools .del { color: var(--danger); }
.consigne { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 9px 12px; font-size: 15px; display: flex; gap: 8px; align-items: flex-start; }
.consigne svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--accent); }
.flagnote { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 9px 12px; font-size: 15px; display: flex; gap: 8px; }
.flagnote svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.last { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; font-size: 15px; color: var(--ink-2); display: flex; flex-direction: column; gap: 2px; }
.last b { color: var(--ink); }
.last .q { font-style: italic; color: var(--ink-3); }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set { display: grid; grid-template-columns: 26px 1fr 1fr 52px 36px; gap: 8px; align-items: center; }
.set-h { font-size: 13px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.set-n { font-family: var(--font-display); font-size: 19px; color: var(--ink-3); text-align: center; }
.set input { text-align: center; font-size: 20px; font-weight: 600; padding: 8px 4px; min-height: 52px; }
.set .check { height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-3); }
.set .check svg { width: 24px; height: 24px; }
.set.done .check { background: var(--good); border-color: var(--good); color: #fff; }
.set.done input { background: var(--good-bg); border-color: transparent; }
.set .x { height: 40px; border: 0; background: none; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; }
.set .x svg { width: 18px; height: 18px; }
.stars { display: flex; gap: 4px; }
.stars button { width: 44px; height: 44px; border: 0; background: none; cursor: pointer; color: var(--line); padding: 0; display: grid; place-items: center; }
.stars button.on { color: var(--heart); }
.stars button:active svg { transform: scale(1.2); }
.stars svg { width: 30px; height: 30px; }
.lbl { font-size: 13px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.inc-amt { display: inline-flex; gap: 8px; align-items: center; }
.inc-amt input { width: 84px; text-align: center; }
.inc-amt select { width: auto; min-width: 120px; }
.pace { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--accent); }
/* ---- Dessins ---- */
.hero { position: relative; display: grid; grid-template-columns: 1fr 132px; align-items: center; gap: 8px; background: linear-gradient(135deg, var(--art-blush), var(--art-beige)); border-radius: 26px; padding: 18px 12px 18px 20px; overflow: hidden; }
.hero h1 { font-size: 28px; }
.hero svg { width: 132px; height: auto; }
.art-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 14px 6px; color: var(--ink-3); }
.art-empty svg { width: 86px; height: auto; }
.card-art { display: flex; align-items: center; gap: 10px; }
.card-art svg { width: 38px; height: 38px; flex: none; }
.wmode { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 4px; }
.wmode button { min-height: 36px; border: 0; border-radius: 999px; background: transparent; font-weight: 700; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.wmode button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.barrow { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink-2); flex-wrap: wrap; }
.barrow input { width: 90px; min-height: 42px; text-align: center; }
.totline { font-size: 14px; color: var(--ink-3); }
.durbox { background: var(--accent-soft); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.durbox b { font-family: var(--font-display); font-size: 22px; color: var(--accent); }
.version { text-align: center; font-size: 13px; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 8px; }
.version svg { width: 60px; }
.sticky-actions { display: flex; flex-direction: column; gap: 10px; }

/* ---- Historique ---- */
.srow { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 4px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.srow:first-child { border-top: 0; }
.srow-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.srow-main b { font-size: 17px; }
.srow-main span { font-size: 14px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
.srow .date { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--ink-2); width: 52px; flex: none; line-height: 1; text-align: center; }
.srow .date small { display: block; font-size: 13px; font-family: var(--font-body); font-weight: 600; color: var(--ink-3); text-transform: uppercase; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .dow { font-size: 12px; font-weight: 700; color: var(--ink-3); padding: 4px 0; }
.cal button { aspect-ratio: 1 / 1; min-height: 40px; border-radius: 10px; border: 1px solid transparent; background: var(--surface-2); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 600; font-size: 15px; padding: 0; color: var(--ink-2); }
.cal button.out { background: transparent; color: var(--ink-3); opacity: .5; }
.cal button.today { border-color: var(--accent); color: var(--accent); }
.cal button.sel { background: var(--accent-soft); }
.cal .dots { display: flex; gap: 2px; height: 7px; }
.cal .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

/* ---- Graphiques ---- */
.chart { position: relative; width: 100%; min-height: 60px; touch-action: pan-y; }
.chart svg { display: block; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 13px; line-height: 1.3; white-space: nowrap; transform: translate(-50%, -100%); top: 0; display: none; z-index: 2; }
.chart .tip b { font-size: 16px; display: block; }
.empty { color: var(--ink-3); font-size: 15px; padding: 12px 0; }
details summary { cursor: pointer; font-weight: 600; color: var(--accent); min-height: 40px; display: flex; align-items: center; }
table.data { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; }
table.data th { font-size: 13px; color: var(--ink-3); font-weight: 700; }
.tbl-wrap { overflow-x: auto; }

/* ---- Onglets du bas ---- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; min-height: 56px; font-size: 12px; font-weight: 600; color: var(--ink-3); cursor: pointer; border-radius: 10px; }
.tabs button svg { width: 24px; height: 24px; }

<script>
"use strict";
/* =====================================================================
   PARTIE 2 : LE PROGRAMME (JavaScript)
   Plan du code :
     0. Petits outils (dates, nombres, sécurité du texte)
     1. Réglages par défaut (types de séance, exercices habituels)
     2. L'état de l'appli (toutes les données en mémoire)
     3. Le stockage (base synchronisée Claude, ou navigateur en secours)
     4. La logique sport (dernière fois, consignes, stats)
     5. Fenêtres, confirmations et messages "Annuler"
     6. Les écrans (accueil, séance, historique, progrès, semaine, plus)

/* ---------------------------------------------------------------------

   --------------------------------------------------------------------- */
const $ = (sel, root = document) => root.querySelector(sel);

// Identifiant unique (ex. "m3x9k2abcd") pour chaque séance, exercice…

// Copie profonde d'un objet (évite de modifier l'original par accident)
const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
// Échappe le texte que TU tapes avant de l'afficher (empêche qu'un "<" casse la page)
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Normalise un nom d'exercice pour comparer "Développé couché" et "developpe couche "
const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
const pad2 = (n) => String(n).padStart(2, "0");
const DAY = 86400000;

// Dates au format "2026-11-19" (heure locale, pas UTC)
function dateStr(d = new Date()) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function parseDate(s) { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); }
const isDateStr = (s) => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ""));
const fmtDay = (s) => parseDate(s).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
const fmtShort = (s) => parseDate(s).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const fmtLong = (d) => d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
function fmtWhen(ts) { return new Date(ts).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
function daysAgo(s) {
  const n = Math.round((parseDate(dateStr()) - parseDate(s)) / DAY);
  return n === 0 ? "aujourd'hui" : n === 1 ? "hier" : n < 0 ? "à venir" : `il y a ${n} j`;
}
// Semaine ISO (lundi → dimanche), ex. "2026-W47"
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear(); const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / DAY + 1) / 7);
  return { y, w, id: `${y}-W${pad2(w)}` };
}
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }

// Lit un nombre tapé ("42,5" ou "42.5"). Renvoie null si vide, NaN si invalide.
function parseNum(v) {
  if (v == null) return null;
  const t = String(v).trim().replace(",", ".").replace(/\s/g, "");
  if (!t) return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : NaN;
}
// Lit une durée et la convertit en minutes : "45", "45:30", "1:05:00", "1h05", "45min", "45'30"
function parseDur(v) {
  const t = String(v ?? "").trim().toLowerCase().replace(",", ".");
  if (!t) return null;
  let m;
  if ((m = t.match(/^(\d+):(\d{1,2}):(\d{1,2})$/))) return +m[1] * 60 + +m[2] + +m[3] / 60;
  if ((m = t.match(/^(\d+):(\d{1,2})$/))) return +m[1] + +m[2] / 60;
  if ((m = t.match(/^(\d+(?:\.\d+)?)\s*(?:min|mn|m|')?$/))) return +m[1];
  if ((m = t.match(/^(\d+)\s*h\s*(\d{1,2})?\s*(?:min|mn|m)?$/))) return +m[1] * 60 + (+m[2] || 0);
  if ((m = t.match(/^(\d+)\s*(?:min|mn|m|')\s*(\d{1,2})\s*(?:s|")?$/))) return +m[1] + +m[2] / 60;
  return NaN;
}
const ok = (n) => n != null && Number.isFinite(n);
const fmtNum = (n, d = 1) => (ok(n) ? n.toLocaleString("fr-FR", { maximumFractionDigits: d }) : "–");
const toInput = (n) => (ok(n) ? String(Math.round(n * 100) / 100).replace(".", ",") : "");
function fmtDur(min) {
  if (!ok(min)) return "–";
  const totalS = Math.round(min * 60); const h = Math.floor(totalS / 3600); const m = Math.floor((totalS % 3600) / 60); const s = totalS % 60;
  if (h) return `${h} h ${pad2(m)}`;
  return s ? `${m}:${pad2(s)}` : `${m} min`;
}
function fmtPace(minPerKm) {
  if (!ok(minPerKm) || minPerKm <= 0) return "–";
  let m = Math.floor(minPerKm); let s = Math.round((minPerKm - m) * 60); if (s === 60) { m++; s = 0; }
  return `${m}'${pad2(s)}"`;
}
function withTimeout(p, ms) { return Promise.race([p, new Promise((r) => setTimeout(() => r(null), ms))]); }
const plural = (n, one, many) => `${n} ${n > 1 ? many || one + "s" : one}`;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Petites icônes dessinées en SVG (pas d'images externes)
const ICONS = {

/* Petits dessins (SVG faits main, couleurs reprises du thème → marchent aussi en mode sombre) */
const sparkle = (x, y, r, c = "var(--art-gold)") => `<path d="M${x} ${y - r}Q${x} ${y} ${x + r} ${y}Q${x} ${y} ${x} ${y + r}Q${x} ${y} ${x - r} ${y}Q${x} ${y} ${x} ${y - r}Z" fill="${c}"/>`;

const safeId = (id) => (/^[A-Za-z0-9_\-.~:@+]{1,100}$/.test(String(id || "")) ? String(id) : newId());

/* ---------------------------------------------------------------------

   Trois modes :
   - "cloud"   : la page est ouverte comme artefact Claude → base de
                 données privée liée à ton compte, synchronisée entre
                 téléphone et ordi.
   - "offline" : artefact Claude mais base injoignable (pas de réseau…)
                 → on travaille sur la copie de l'appareil, et les
                 changements partent dès que la base répond.

const LS = {

// --- Miroir local (copie de secours dans le navigateur) ---

// --- File d'attente durable ---

/* persist() = "cette donnée a changé, enregistre-la".
   delay : on attend un peu pour regrouper les frappes (pas une écriture par lettre). */
function persist(kind, id, delay = 700) {

  const key = keyOf(kind, id); const ts = Date.now();
  Store.pending.set(key, { kind, id, ts });
  Store.outbox[key] = { kind, id, ts };

}

// Envoie les écritures en attente à la base (3 en parallèle max, une seule à la fois par document)
function flush() {
  Store.timer = null;
  if (Store.mode !== "cloud") return;
  for (const [key, p] of [...Store.pending]) {
    if (Store.inflight.has(key)) continue;
    if (Store.inflight.size >= 3) break;
    Store.pending.delete(key); Store.inflight.add(key);
    writeOne(p).then(() => {
      Store.inflight.delete(key); Store.backoff = 0;
      const ob = Store.outbox[key];
      if (!Store.pending.has(key) && ob && ob.ts <= p.ts) { delete Store.outbox[key]; saveOutboxSoon(); }
      updateSyncChip();
      if (Store.pending.size) scheduleFlush(0);
    }, (err) => {
      Store.inflight.delete(key);
      const code = (err && err.code) || "unavailable";
      if (code === "invalid_argument" || code === "quota_exceeded" || code === "transform_error") {
        delete Store.outbox[key]; saveOutboxSoon();
        toast(code === "quota_exceeded" ? "Stockage plein : exporte tes données puis vide la corbeille." : "Une donnée n'a pas pu être enregistrée en ligne (elle reste sur cet appareil).", { error: true, duration: 8000 });
        console.warn("Écriture refusée", key, err);
      } else if (["revoked", "not_granted", "capability_disabled", "capability_removed"].includes(code)) {

      } else {
        if (!Store.pending.has(key)) Store.pending.set(key, p);

  let uid = null;

/* startCloud : branche l'appli sur une base (Claude ou Firebase, même façon de parler)
   et s'abonne aux changements : si tu modifies sur l'ordi, le téléphone se met à jour tout seul. */

/* --- FIREBASE : ta propre base, sans passer par Claude ---
   Firestore (la base de Firebase) se manipule presque exactement comme celle de Claude :
   doc(), collection(), set(), delete(), onSnapshot(). fbWrap() fait la traduction. */
const FB_VER = "10.12.2";
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("Chargement impossible : " + src)); document.head.appendChild(el); });
}

  if (window.firebase && window.firebase.firestore && window.firebase.auth) return;
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  await loadScript(base + "firebase-app-compat.js");
  await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]);
}
function fbWrap(fs) {
  const mapErr = (e) => {

    return { code: c === "permission_denied" || c === "unauthenticated" ? "revoked" : c === "deadline_exceeded" ? "unavailable" : c, message: e && e.message };
  };

    orderBy: (f, d) => wrapQ(q.orderBy(f, d)), limit: (n) => wrapQ(q.limit(n)),
    get: () => q.get().catch(rethrow),
    onSnapshot: (next, err) => q.onSnapshot(opts, next, (e) => err && err(mapErr(e))),
  });

    id: d.id, path: d.path,
    get: () => d.get().catch(rethrow), set: (x) => d.set(x).catch(rethrow), delete: () => d.delete().catch(rethrow),
    onSnapshot: (next, err) => d.onSnapshot(opts, next, (e) => err && err(mapErr(e))),

  });

}
async function initFirebase(conf) {

  try { await Promise.race([loadFirebase(), sleep(15000).then(() => { throw new Error("timeout"); })]); }
  catch (e) { console.warn(e); return goOffline("Firebase n'a pas pu se charger (pas de réseau ?). Tu travailles sur la copie de cet appareil ; tout partira à la prochaine ouverture avec du réseau."); }
  try { if (!firebase.apps.length) firebase.initializeApp(conf); Store.fbAuth = firebase.auth(); }
  catch (e) { console.error(e); return goOffline("La configuration Firebase est invalide : vérifie-la dans Plus → Synchronisation."); }

    Store.fbUser = user || null;
    if (user) {
      // Première connexion de cet appareil à ce compte : on envoie aussi ce qui était déjà noté ici (fusion)
      const flag = "carnet.fbSeeded." + user.uid;
      if (!LS.get(flag, false)) { seedOutboxFromLocal(); LS.set(flag, true); }
      startCloud(fbWrap(firebase.firestore()), `users/${user.uid}`, "firebase");
    } else {
      stopCloud();
      goOffline("Connecte-toi (Plus → Synchronisation) pour retrouver tes données sur tous tes appareils. En attendant, tout est gardé sur cet appareil.", true);
    }

// Met toutes les données de l'appareil dans la file d'envoi (la version la plus récente gagnera)
function seedOutboxFromLocal() {
  const now = Date.now();
  if (S.config) Store.outbox.config = { kind: "config", id: null, ts: S.config.updatedAt || now, seed: true };
  for (const kind of KINDS) for (const [id, v] of Object.entries(S[kind])) Store.outbox[`${kind}/${id}`] = { kind, id, ts: v.updatedAt || now };
  saveOutboxNow();
}
// Lit la config collée depuis la console Firebase (accepte le bout de code JavaScript tel quel)
function parseFirebaseConfig(text) {
  let t = String(text || "").trim(); const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b < a) return null;
  t = t.slice(a, b + 1);
  let o = null;
  try { o = JSON.parse(t); } catch (e) {
    const j = t.replace(/(^|\s)\/\/.*$/gm, "$1").replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":').replace(/'([^']*)'/g, '"$1"').replace(/,\s*}/g, "}");
    try { o = JSON.parse(j); } catch (e2) { return null; }
  }

}
const AUTH_ERR = {

}

// Réception de la config depuis la base
function onConfigSnap(snap) {
  const definitive = !snap.metadata.fromCache;
  if (snap.exists) {
    const data = snap.data();
    const ob = Store.outbox.config;
    if (!ob || ob.seed || (data.updatedAt || 0) > ob.ts) {

// Réception d'une collection (séances, semaines, corbeille) depuis la base

    const data = d.data(); const key = `${kind}/${d.id}`; const ob = Store.outbox[key];
    if (ob) {
      // Tu as une modif locale pas encore envoyée : on garde la tienne, sauf si l'autre appareil a modifié après toi
      if ((data.updatedAt || 0) > ob.ts && !Store.inflight.has(key)) { delete Store.outbox[key]; Store.pending.delete(key); }
      else continue;

  for (const id of ids) if (JSON.stringify(local[id]) !== JSON.stringify(next[id])) { changed = true; break; }
  S[kind] = next;

  if (Store.pending.size) scheduleFlush(100);

/* --- Sauvegardes complètes (pour "revenir en arrière") ---
   En mode synchronisé : stockées dans la base, découpées en morceaux.
   En mode local : dans le navigateur (5 dernières). */
function snapshotData() {
  return { app: "carnet-entrainement", version: 1, exportedAt: new Date().toISOString(),
    config: S.config, sessions: Object.values(S.sessions), weeks: Object.values(S.weeks), trash: Object.values(S.trash) };
}
async function createBackup(reason) {
  const json = JSON.stringify(snapshotData());
  const meta = { id: newId(), at: Date.now(), reason: str(reason, 80), size: json.length,
    sessions: Object.keys(S.sessions).length, weeks: Object.keys(S.weeks).length };
  try {
    if (Store.mode === "cloud") {
      const CH = 60000; meta.parts = Math.ceil(json.length / CH) || 1;
      const ref = Store.base.collection("backups").doc(meta.id);
      for (let i = 0; i < meta.parts; i++) await retry(() => ref.collection("parts").doc(String(i)).set({ i, s: json.slice(i * CH, (i + 1) * CH) }));
      await retry(() => ref.set(meta)); // la fiche est écrite en dernier : une sauvegarde incomplète reste invisible
      pruneBackups();
    } else {
      const list = LS.get("carnet.backups", []);
      list.unshift({ ...meta, data: json });
      while (list.length > 5) list.pop();
      while (!LS.set("carnet.backups", list) && list.length > 1) list.pop();
    }
    return meta;
  } catch (e) { console.warn("Sauvegarde impossible", e); return null; }
}
async function listBackups() {
  if (Store.mode === "cloud") {
    const snap = await retry(() => Store.base.collection("backups").orderBy("at", "desc").limit(30).get());
    return snap.docs.map((d) => d.data());
  }
  return LS.get("carnet.backups", []).map(({ data, ...m }) => m);
}
async function readBackup(id) {
  if (Store.mode === "cloud") {
    const ref = Store.base.collection("backups").doc(id);
    const meta = (await retry(() => ref.get())).data();
    if (!meta) throw new Error("Sauvegarde introuvable");
    let json = "";

  }
  const b = LS.get("carnet.backups", []).find((x) => x.id === id);
  if (!b) throw new Error("Sauvegarde introuvable");

}
async function pruneBackups() {

// Une sauvegarde automatique par jour, au premier lancement

/* ---------------------------------------------------------------------
   4. LA LOGIQUE SPORT
   --------------------------------------------------------------------- */
let sortedCache = null;
// Toutes les séances, de la plus récente à la plus ancienne
function sortedSessions() {
  if (!sortedCache) sortedCache = Object.values(S.sessions).sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  return sortedCache;
}
const typeOf = (s) => cfg().types.find((t) => t.id === s.typeId);
const colorVar = (n) => `var(--c${Math.max(1, Math.min(8, n || 1))})`;
function sessionColor(s) { const t = typeOf(s); if (t) return colorVar(t.color); let h = 0; for (const ch of s.typeName || "") h = (h * 31 + ch.charCodeAt(0)) % 8; return colorVar(h + 1); }
const sessionName = (s) => (typeOf(s) || {}).name || s.typeName;

// Une série compte si elle est validée ou si un poids / des répétitions sont notés
function filledSets(ex) {
  return (ex.sets || []).filter((st) => st.done || String(st.kg).trim() || String(st.reps).trim())
    .map((st) => ({ kg: parseNum(st.kg !== "" ? st.kg : st.done ? st.tkg : ""), reps: parseNum(st.reps !== "" ? st.reps : st.done ? st.treps : "") }))
    .filter((x) => !Number.isNaN(x.kg) && !Number.isNaN(x.reps));
}
const exHasData = (ex) => filledSets(ex).length > 0 || !!String(ex.note || "").trim() || ex.rating > 0;
/* Poids "total" ou "par côté" :
   - total    : tu notes le poids complet (haltère, machine…)
   - par côté : tu notes ce que tu mets de CHAQUE côté de la barre ; le total
                réel = 2 × côté + poids de la barre (si tu l'as noté).
   Les graphiques et records utilisent toujours le total réel, pour que tout reste comparable. */
const isSide = (ex) => ex && ex.wmode === "side";
const unitLbl = (ex) => (isSide(ex) ? "kg/côté" : "kg");
function effKg(ex, kg) {
  if (!ok(kg)) return kg;
  if (!isSide(ex)) return kg;
  const bar = parseNum(ex.bar); return kg * 2 + (ok(bar) ? bar : 0);
}
function exStats(ex) {
  const fs = filledSets(ex);
  let max = null, rawMax = null, e1rm = null, volume = 0, best = null, reps = 0;
  for (const x of fs) {
    const k = effKg(ex, x.kg);
    if (ok(k) && (max == null || k > max)) { max = k; rawMax = x.kg; best = x; }
    if (ok(k) && ok(x.reps) && x.reps > 0) { const r = k * (1 + x.reps / 30); if (e1rm == null || r > e1rm) e1rm = r; volume += k * x.reps; }
    if (ok(x.reps)) reps += x.reps;
  }
  return { max, rawMax, e1rm, volume, best, reps, sets: fs.length };
}
// "3 × 10 à 40 kg", "3 × 10 à 20 kg/côté (+ barre 20)" ou "10×40 · 8×42,5 kg"
function setsSummary(ex) {
  const fs = filledSets(ex);
  if (!fs.length) return "aucune série notée";
  const r = (x) => (ok(x.reps) ? x.reps : "?");
  const bar = parseNum(ex.bar);
  const tail = isSide(ex) && ok(bar) ? ` (+ barre ${fmtNum(bar, 1)})` : "";
  if (fs.every((x) => x.kg === fs[0].kg && x.reps === fs[0].reps)) {
    return `${fs.length} × ${r(fs[0])}` + (ok(fs[0].kg) ? ` à ${fmtNum(fs[0].kg, 2)} ${unitLbl(ex)}${tail}` : " (poids du corps)");
  }
  const anyKg = fs.some((x) => ok(x.kg));
  return fs.map((x) => (anyKg ? `${r(x)}×${ok(x.kg) ? fmtNum(x.kg, 2) : "PdC"}` : r(x))).join(" · ") + (anyKg ? ` ${unitLbl(ex)}${tail}` : " reps");
}
// Retrouve la dernière fois que tu as fait cet exercice AVANT la séance en cours
function lastTime(name, cur) {
  const n = norm(name);
  for (const s of sortedSessions()) {
    if (s.id === cur.id) continue;
    if (s.date > cur.date || (s.date === cur.date && (s.createdAt || 0) >= (cur.createdAt || 0))) continue;
    const ex = (s.exercises || []).find((e) => norm(e.name) === n && exHasData(e));
    if (ex) return { s, ex };
  }
  return null;
}
function lastCardio(cur) {
  for (const s of sortedSessions()) {
    if (s.id === cur.id || s.kind !== cur.kind || !s.cardio) continue;
    if (s.date > cur.date || (s.date === cur.date && (s.createdAt || 0) >= (cur.createdAt || 0))) continue;
    if (s.cardio.dist || s.cardio.dur || s.cardio.note) return s;
  }
  return null;
}
// Texte de la consigne "augmenter la prochaine fois"
function consigneText(ex) {
  if (!ex.inc || !ex.inc.on) return "";
  const a = parseNum(ex.inc.amount);
  if (!ok(a)) return "augmenter la prochaine fois";
  const st = exStats(ex);
  const u = ex.inc.unit === "kg" ? unitLbl(ex) : ex.inc.unit;
  let t = `+${fmtNum(a, 2)} ${u}`;
  if (ex.inc.unit === "kg" && ok(st.rawMax)) t += ` → vise ${fmtNum(st.rawMax + a, 2)} ${u}`;
  if (ex.inc.unit === "reps" && st.best && ok(st.best.reps)) t += ` → vise ${st.best.reps + a} reps`;
  return t;
}
// Crée un exercice pré-rempli : les objectifs (gris) viennent de la dernière fois + consigne éventuelle
function buildExercise(name, tpl, session) {
  const last = lastTime(name, session);
  let sets;
  if (last && filledSets(last.ex).length) {
    const inc = last.ex.inc && last.ex.inc.on ? parseNum(last.ex.inc.amount) : null;
    const unit = last.ex.inc && last.ex.inc.unit;
    sets = filledSets(last.ex).map((x) => ({ kg: "", reps: "", done: false,
      tkg: ok(x.kg) ? toInput(x.kg + (ok(inc) && unit === "kg" ? inc : 0)) : "",
      treps: ok(x.reps) ? String(x.reps + (ok(inc) && unit === "reps" ? inc : 0)) : "" }));
  } else {
    const n = Math.max(1, Math.min(10, parseInt(tpl && tpl.sets) || 3));
    sets = Array.from({ length: n }, () => ({ kg: "", reps: "", done: false, tkg: "", treps: tpl && tpl.reps ? String(tpl.reps) : "" }));
  }
  const prev = last ? last.ex : lastAnyTime(name, session);
  return { id: newId(), name, sets, rating: 0, note: "", tech: false, inc: { on: false, amount: cfg().incDefault || "2", unit: "kg" },
    wmode: prev && prev.wmode === "side" ? "side" : (tpl && tpl.wmode === "side" ? "side" : "total"), bar: prev && prev.bar ? prev.bar : "" };
}
// Même nom d'exercice, n'importe quand (pour retrouver le mode de poids choisi)
function lastAnyTime(name, cur) {
  const n = norm(name);
  for (const s of sortedSessions()) { if (s.id === cur.id) continue; const ex = s.exercises.find((e) => norm(e.name) === n); if (ex) return ex; }
  return null;
}
function createSession(typeId, date) {
  const t = cfg().types.find((x) => x.id === typeId);
  if (!t) return null;
  const s = { id: newId(), typeId: t.id, typeName: t.name, kind: t.kind, date: date || dateStr(), createdAt: Date.now(), updatedAt: Date.now(), endedAt: null,
    exercises: [], cardio: null, note: "", rating: 0, dur: "", finisher: null };
  // Cardio de fin : si tu en as fait un la dernière fois sur ce type de séance, on le propose déjà
  const prevF = sortedSessions().find((x) => x.typeId === t.id && x.finisher);
  if (prevF) s.finisher = { type: prevF.finisher.type, dur: "", dist: "", note: "", tdur: prevF.finisher.dur || "" };
  if (t.kind === "course") s.cardio = { sub: cfg().runTypes[0] || "", dist: "", dur: "", rounds: "", rating: 0, note: "", inc: { on: false, amount: "1", unit: "km" } };
  if (t.kind === "boxe") s.cardio = { sub: cfg().boxeTypes[0] || "", dist: "", dur: "", rounds: "", rating: 0, note: "", inc: { on: false, amount: "5", unit: "min" } };
  for (const e of t.exercises) if (e.name && e.name.trim()) s.exercises.push(buildExercise(e.name.trim(), e, s));
  return s;
}
function saveSession(s, delay) { s.updatedAt = Date.now(); S.sessions[s.id] = s; sortedCache = null; persist("sessions", s.id, delay); }
function cardioStats(s) {
  const c = s.cardio || {}; const dist = parseNum(c.dist); const dur = parseDur(c.dur);
  const pace = ok(dist) && ok(dur) && dist > 0 ? dur / dist : null;
  return { dist, dur, pace, speed: ok(pace) ? 60 / pace : null };
}
// Durées : séance (muscu) ou activité principale (course/boxe) + cardio de fin = total
function sessionDurations(s) {
  const main = s.kind === "muscu" ? parseDur(s.dur) : parseDur(s.cardio && s.cardio.dur);
  const fin = s.finisher ? parseDur(s.finisher.dur) : null;
  const m = ok(main) ? main : null, f = ok(fin) ? fin : null;
  return { main: m, fin: f, total: m == null && f == null ? null : (m || 0) + (f || 0) };
}
function sessionSummary(s) {
  const base = sessionSummaryBase(s); const d = sessionDurations(s);
  const extra = [];
  if (s.finisher && (s.finisher.dur || s.finisher.type)) extra.push(`+ ${s.finisher.type || "cardio"}${ok(d.fin) ? " " + fmtDur(d.fin) : ""}`);
  if (ok(d.total) && (s.kind === "muscu" || ok(d.fin))) extra.push(`total ${fmtDur(d.total)}`);
  return [base, ...extra].join(" · ");
}
function sessionSummaryBase(s) {
  if (s.kind === "course") { const c = cardioStats(s); const parts = []; if (ok(c.dist)) parts.push(`${fmtNum(c.dist, 2)} km`); if (ok(c.dur)) parts.push(fmtDur(c.dur)); if (ok(c.pace)) parts.push(fmtPace(c.pace) + "/km"); return parts.join(" · ") || (s.cardio && s.cardio.sub) || "à compléter"; }
  if (s.kind === "boxe") { const c = cardioStats(s); return [ok(c.dur) ? fmtDur(c.dur) : "", s.cardio && s.cardio.sub].filter(Boolean).join(" · ") || "à compléter"; }
  const exs = s.exercises.filter(exHasData); const vol = exs.reduce((a, e) => a + exStats(e).volume, 0);
  return `${exs.length}/${s.exercises.length} exercices` + (vol ? ` · ${fmtNum(vol, 0)} kg soulevés` : "");
}
// Pour chaque exercice : sa dernière occurrence (pour "à retravailler" et "consignes")
function latestByExercise() {
  const seen = new Map();
  for (const s of sortedSessions()) for (const e of s.exercises) { const k = norm(e.name); if (!seen.has(k) && exHasData(e)) seen.set(k, { s, ex: e }); }
  return [...seen.values()];
}
function sessionsInRange(from, to) { return sortedSessions().filter((s) => s.date >= from && s.date <= to); }

let toastTimer = null;
function toast(msg, opts = {}) {
  const root = $("#toasts");
  clearTimeout(toastTimer);
  root.innerHTML = `<div class="toast ${opts.error ? "err" : ""}" role="status"><span></span>${opts.action ? `<button type="button">${esc(opts.action)}</button>` : ""}</div>`;
  root.querySelector("span").textContent = msg;
  if (opts.action) root.querySelector("button").onclick = () => { root.innerHTML = ""; clearTimeout(toastTimer); opts.onAction && opts.onAction(); };
  toastTimer = setTimeout(() => { root.innerHTML = ""; }, opts.duration || (opts.action ? 7000 : 3200));
}
// Message "Supprimé — Annuler" (7 secondes)
function undoToast(msg, undo) { toast(msg, { action: "Annuler", onAction: undo, duration: 7000 }); }

let modalClose = null;
function openModal({ title, body = "", actions = [], onOpen }) {
  closeModal();
  const root = $("#modal-root");
  root.innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog"><h2>${esc(title)}</h2><div class="stack">${body}</div><div class="actions"></div></div></div>`;
  const acts = root.querySelector(".actions");
  actions.forEach((a) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "btn " + (a.kind || ""); b.textContent = a.label;
    b.onclick = () => { const r = a.onClick ? a.onClick() : undefined; if (r !== false) closeModal(); };
    acts.appendChild(b);
  });
  const ov = root.querySelector(".overlay");
  ov.addEventListener("click", (e) => { if (e.target === ov) closeModal(); });
  modalClose = () => { root.innerHTML = ""; };
  onOpen && onOpen(root);
  autosizeAll(root);
  // focus sur le premier champ, sinon sur le DERNIER bouton (souvent "Annuler") pour éviter une suppression par erreur
  const first = root.querySelector("input, textarea, select") || acts.querySelector("button:last-child");
  first && setTimeout(() => first.focus(), 30);
}
function closeModal() {
  if (modalClose) { const f = modalClose; modalClose = null; f(); }
  if (needRender && !isTyping()) { needRender = false; setTimeout(render, 0); }
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
function confirmBox(title, text, okLabel = "Supprimer", danger = true) {
  return new Promise((resolve) => {
    openModal({ title, body: `<p>${esc(text)}</p>`, actions: [
      { label: okLabel, kind: danger ? "danger" : "", onClick: () => resolve(true) },
      { label: "Annuler", kind: "ghost", onClick: () => resolve(false) },
    ] });
    // fermer par le fond ou Échap = annuler
    const prev = modalClose; modalClose = () => { prev(); resolve(false); };
  });
}

// Ajoute un élément à la corbeille
function toTrash(kind, label, payload, extra = {}) {
  const t = { id: newId(), kind, at: Date.now(), updatedAt: Date.now(), label, payload: clone(payload), ...extra };
  S.trash[t.id] = t; persist("trash", t.id, 0);
  return t.id;
}
function restoreTrash(tid, silent) {
  const t = S.trash[tid];
  if (!t) return false;
  const p = clone(t.payload);
  if (t.kind === "session") { const s = normSession(p); s.id = p.id; saveSession(s, 0); }
  else if (t.kind === "exercise") {
    const s = S.sessions[t.sessionId];
    if (!s) { toast("La séance de cet exercice est dans la corbeille : restaure-la d'abord.", { error: true }); return false; }
    s.exercises.splice(Math.min(t.index, s.exercises.length), 0, normExercise(p)); saveSession(s, 0);
  } else if (t.kind === "week") { const w = normWeek(p); w.updatedAt = Date.now(); S.weeks[w.id] = w; persist("weeks", w.id, 0); }
  else if (t.kind === "type") {
    const c = cfg(); if (!c.types.some((x) => x.id === p.id)) c.types.splice(Math.min(t.index, c.types.length), 0, p);
    c.updatedAt = Date.now(); persist("config", null, 0);
  }
  delete S.trash[tid]; persist("trash", tid, 0);
  if (!silent) toast("Restauré");
  renderSoon();
  return true;
}

/* ---- HISTORIQUE ---- */
function viewHistory() {
  const c = cfg(); const all = sortedSessions();
  const list = all.filter((s) => S.ui.histType === "all" || s.typeId === S.ui.histType);
  const today = new Date(); const mon = mondayOf(today);
  const weekN = sessionsInRange(dateStr(mon), dateStr(addDays(mon, 6))).length;
  const monthN = sessionsInRange(dateStr(new Date(today.getFullYear(), today.getMonth(), 1)), dateStr(today)).length;
  const avg8 = sessionsInRange(dateStr(addDays(mon, -56)), dateStr(addDays(mon, -1))).length / 8;
  let h = `<h1>Historique</h1>
    <div class="tiles"><div class="tile"><b>${weekN}</b><span>cette semaine</span></div><div class="tile"><b>${monthN}</b><span>ce mois-ci</span></div><div class="tile"><b>${fmtNum(avg8, 1)}</b><span>par semaine (8 dern.)</span></div></div>

  h += `<section class="card">${calendar(list)}</section>`;
  // Barres : séances par semaine (12 dernières semaines)
  const items = [];
  for (let k = 11; k >= 0; k--) {
    const m = addDays(mon, -7 * k); const n = list.filter((s) => s.date >= dateStr(m) && s.date <= dateStr(addDays(m, 6))).length;
    items.push({ label: fmtShort(dateStr(m)), value: n, tip: `${n} séance${n > 1 ? "s" : ""}`, sub: `sem. du ${fmtShort(dateStr(m))}` });
  }
  h += `<section class="card"><h3>Régularité</h3><p class="small muted">Séances par semaine, 12 dernières semaines</p>${chartBox({ type: "bars", items, label: "Séances par semaine" })}</section>`;
  let rows = list;
  if (S.ui.histDate) rows = list.filter((s) => s.date === S.ui.histDate);
  h += `<section class="card"><div class="section-title"><h3>${S.ui.histDate ? esc(fmtDay(S.ui.histDate)) : "Toutes les séances"}</h3>${S.ui.histDate ? `<button class="link" data-act="clearday">Tout afficher</button>` : `<span class="muted small">${rows.length}</span>`}</div>`;
  if (!rows.length) h += all.length ? `<p class="empty">Aucune séance pour ce filtre.</p>` : emptyArt("Aucune séance pour l'instant. Lance ta première depuis l'accueil !");

    let curMonth = "";

    for (const s of rows.slice(0, 300)) {
      const mLabel = parseDate(s.date).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
      if (mLabel !== curMonth && !S.ui.histDate) { curMonth = mLabel; h += `<div class="lbl" style="padding-top:10px">${esc(mLabel)}</div>`; }

    }

  }

}
function calendar(list) {
  const base = S.ui.calMonth ? parseDate(S.ui.calMonth) : new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const first = new Date(base.getFullYear(), base.getMonth(), 1); const start = mondayOf(first);
  const byDate = {}; for (const s of list) (byDate[s.date] = byDate[s.date] || []).push(s);
  const today = dateStr();
  let h = `<div class="cal-head"><button class="icon-btn" data-act="calnav" data-dir="-1" aria-label="Mois précédent">${icon("back")}</button>
    <h3 style="text-transform:capitalize">${esc(first.toLocaleDateString("fr-FR", { month: "long", year: "numeric" }))}</h3>
    <button class="icon-btn" data-act="calnav" data-dir="1" aria-label="Mois suivant" style="transform:scaleX(-1)">${icon("back")}</button></div>
    <div class="cal">${["L", "M", "M", "J", "V", "S", "D"].map((d) => `<span class="dow">${d}</span>`).join("")}`;
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i); const ds = dateStr(d);

    const ses = byDate[ds] || [];
    h += `<button data-act="calday" data-date="${ds}" class="${d.getMonth() !== first.getMonth() ? "out" : ""} ${ds === today ? "today" : ""} ${S.ui.histDate === ds ? "sel" : ""}" aria-label="${esc(fmtDay(ds))}, ${ses.length} séance(s)">${d.getDate()}<span class="dots">${ses.slice(0, 3).map((s) => `<i style="--c:${sessionColor(s)}"></i>`).join("")}</span></button>`;
  }
  return h + `</div>`;
}

    h += `<div class="tiles"><div class="tile"><b>${runs.length}</b><span>courses</span></div><div class="tile"><b>${fmtNum(month, 1)}</b><span>km ce mois</span></div><div class="tile"><b>${ppts.length ? fmtPace(Math.min(...ppts.map((p) => p.y))) : "–"}</b><span>meilleure allure</span></div></div>

      <section class="card"><h3>Allure</h3><p class="small muted">Minutes par km : plus c'est bas, plus tu vas vite.</p>${chartBox({ type: "line", pts: ppts, fmt: "pace", label: "Allure par course" })}</section>
      <section class="card"><details><summary>Toutes les courses (${runs.length})</summary><div class="tbl-wrap"><table class="data"><thead><tr><th>Date</th><th>Type</th><th>Km</th><th>Durée</th><th>Allure</th></tr></thead><tbody>
      ${runs.slice().reverse().map((r) => `<tr><td>${esc(fmtShort(r.s.date))}</td><td>${esc(r.s.cardio.sub)}</td><td>${fmtNum(r.c.dist, 2)}</td><td>${fmtDur(r.c.dur)}</td><td>${fmtPace(r.c.pace)}</td></tr>`).join("")}</tbody></table></div></details></section>`;
    return h;
  }
  if (tab === "boxe") {
    const bx = asc.filter((s) => s.kind === "boxe").map((s) => ({ s, c: cardioStats(s) }));
    if (!bx.length) return h + `<div class="card">${emptyArt("Aucune séance de boxe notée pour l'instant.", ART.glove)}</div>`;
    const pts = bx.filter((r) => ok(r.c.dur)).map((r) => ({ t: parseDate(r.s.date).getTime(), y: r.c.dur, tip: fmtDur(r.c.dur), sub: `${fmtShort(r.s.date)} · ${r.s.cardio.sub}` }));
    h += `<section class="card"><h3>Durée des séances</h3>${chartBox({ type: "line", pts, unit: "min", label: "Durée boxe" })}</section>
      <section class="card"><details open><summary>Toutes les séances (${bx.length})</summary><div class="tbl-wrap"><table class="data"><thead><tr><th>Date</th><th>Type</th><th>Durée</th><th>Ressenti</th></tr></thead><tbody>
      ${bx.slice().reverse().map((r) => `<tr><td>${esc(fmtShort(r.s.date))}</td><td>${esc(r.s.cardio.sub)}</td><td>${fmtDur(r.c.dur)}</td><td>${starText(r.s.cardio.rating)}</td></tr>`).join("")}</tbody></table></div></details></section>`;
    return h;
  }
  if (tab === "temps") {
    // Temps d'entraînement par semaine : séance + cardio de fin
    const mon = mondayOf(new Date()); const items = []; let wk = { tot: 0, fin: 0, n: 0 };
    for (let k = 11; k >= 0; k--) {
      const m = addDays(mon, -7 * k); let tot = 0, fin = 0, n = 0;
      for (const s of sessionsInRange(dateStr(m), dateStr(addDays(m, 6)))) { const d = sessionDurations(s); if (ok(d.total)) { tot += d.total; n++; } if (ok(d.fin)) fin += d.fin; }
      if (k === 0) wk = { tot, fin, n };
      items.push({ label: fmtShort(dateStr(m)), value: Math.round((tot / 60) * 10) / 10, tip: fmtDur(tot), sub: `sem. du ${fmtShort(dateStr(m))}${fin ? " · dont cardio de fin " + fmtDur(fin) : ""}` });
    }
    const withDur = sortedSessions().map(sessionDurations).filter((d) => ok(d.total));
    const avg = withDur.length ? withDur.reduce((a, d) => a + d.total, 0) / withDur.length : null;
    h += `<div class="tiles"><div class="tile"><b>${wk.tot ? fmtDur(wk.tot) : "–"}</b><span>cette semaine</span></div><div class="tile"><b>${avg ? fmtDur(avg) : "–"}</b><span>par séance en moyenne</span></div><div class="tile"><b>${wk.fin ? fmtDur(wk.fin) : "–"}</b><span>cardio de fin cette sem.</span></div></div>
      <section class="card"><h3>Heures d'entraînement</h3><p class="small muted">Par semaine, séance + cardio de fin compris (12 dernières semaines).</p>
      ${withDur.length ? chartBox({ type: "bars", items, label: "Heures d'entraînement par semaine" }) : emptyArt("Note la durée de tes séances (dans « Bilan de la séance ») pour voir ce graphique.", ART.bottle)}</section>`;
    return h;
  }
  // Poids corporel
  return h + weightChartCard();
}
function weightChartCard() {
  const ws = Object.values(S.weeks).filter((w) => ok(parseNum(w.weight)) && w.monday).sort((a, b) => a.monday.localeCompare(b.monday));
  const pts = ws.map((w) => ({ t: parseDate(w.monday).getTime(), y: parseNum(w.weight), tip: `${fmtNum(parseNum(w.weight), 1)} kg`, sub: `sem. du ${fmtShort(w.monday)}` }));
  let extra = "";
  if (pts.length >= 2) { const d = pts[pts.length - 1].y - pts[0].y; extra = `<p class="small">Depuis le ${esc(fmtShort(ws[0].monday))} : <b class="num">${d > 0 ? "+" : ""}${fmtNum(d, 1)} kg</b></p>`; }
  return `<section class="card"><div class="card-art">${ART.scale()}<h3>Poids corporel</h3></div>${pts.length ? chartBox({ type: "line", pts, unit: "kg", label: "Poids corporel" }) + extra : emptyArt("Note ton poids dans l'onglet Semaine pour voir la courbe.", ART.scale)}</section>`;
}

let backupsCache = null;

}

/* ---- Rendu général ---- */
function render() {
  const v = S.ui.view;
  try {
    const html = { accueil: viewHome, seance: viewSession, historique: viewHistory, progres: viewProgress, semaine: viewWeek, plus: viewMore, types: viewTypes, corbeille: viewTrash, sauvegardes: viewBackups }[v] || viewHome;
    $("#view").innerHTML = html();
  } catch (e) {
    console.error(e);
    $("#view").innerHTML = `<div class="card"><h3>Oups, cet écran a eu un souci</h3><p class="small muted">Tes données ne sont pas touchées.</p><button class="btn" data-act="nav" data-view="accueil">Retour à l'accueil</button></div>`;
  }
  const tab = TAB_OF[v] || v;
  $$("#tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.view === tab ? "page" : "false"));
  autosizeAll(document);
  drawCharts();
  updateSyncChip();
  updateThemeBtn();

let needRender = false;
const isTyping = () => { const a = document.activeElement; return !!a && a.closest && a.closest("#view") && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && !["checkbox", "radio"].includes(a.type))); };
function renderSoon() {
  if (isTyping() || $("#modal-root").children.length) { needRender = true; return; }
  needRender = false; requestAnimationFrame(render);
}
document.addEventListener("focusout", () => setTimeout(() => { if (needRender && !isTyping() && !$("#modal-root").children.length) { needRender = false; render(); } }, 120));

function updateSyncChip() {
  const el = $("#sync"); if (!el) return;
  const n = Store.pending.size + Store.inflight.size;
  let t = "Connexion…", cls = "";
  if (Store.mode === "local") { t = "Sur cet appareil"; cls = ""; }
  else if (Store.mode === "offline") { t = n || Object.keys(Store.outbox).length ? `Hors ligne · ${Object.keys(Store.outbox).length} en attente` : "Hors ligne"; cls = "warn"; }
  else if (Store.mode === "cloud") {
    if (!Store.ready) { t = "Connexion…"; cls = "busy"; }
    else if (Store.backoff) { t = `Réseau lent · ${n} en attente`; cls = "warn"; }
    else if (n) { t = "Enregistrement…"; cls = "busy"; }
    else { t = "Synchronisé"; cls = "ok"; }
  }
  el.textContent = t; el.className = "sync " + cls;
}
function renderBanner() {
  const b = $("#banner");

  else if (Store.mode === "offline") {
    b.innerHTML = `<div role="status"><span></span>${Store.needLogin ? `<button class="btn sm soft" data-act="nav" data-view="plus">Se connecter</button>` : ""}</div>`;

  else if (Store.mode === "cloud" && Store.slow && !Object.values(Store.defin).every(Boolean)) b.innerHTML = `<div role="status">La base met du temps à répondre : l'affichage vient de la copie de cet appareil et peut être incomplet.</div>`;
